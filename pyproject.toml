[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh4sci"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pymatgen==2026.9.24",
  "pymatgen-core==2026.10.2",
  "ase==3.29.0",
  "numpy>=2.1,<3",
  "spglib==2.7.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["dsh4sci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
